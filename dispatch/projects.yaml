# Registry of ingest projects, consumed by dispatch.py.
#
# Each entry maps one incoming dandiset (local raw copies live under
# <ember-incoming>/<incoming_dandiset_id>/) to one standardized dandiset
# (<ember-standardized>/<standardized_dandiset_id>/), and says how to run
# that lab's conversion script over new sessions.
#
# Fields:
#   lab                     Must match the labs/<lab>/ directory.
#   incoming_dandiset_id    Six-digit dandiset id on the ember archive holding
#                           the raw upload.
#   standardized_dandiset_id  Six-digit dandiset id the converted/standardized
#                           output is uploaded to. May equal incoming_dandiset_id
#                           if raw and standardized data share one dandiset
#                           (as with Kemere below).
#   session_glob            Glob (relative to the incoming project dir) whose
#                           matches' basenames are treated as session ids, used
#                           to detect new/unconverted work.
#   script_path             Path (repo-root-relative) to the conversion script,
#                           hashed to detect when it changes (triggers a full
#                           reprocess via overwrite_flag, see below).
#   convert_command         Argv list to run the conversion. Tokens may use
#                           {repo_root}, {incoming_dir}, {standardized_dir}.
#   dandi_instance          DANDI archive instance name (default: emberarchive).
#   overwrite_flag          Optional single flag appended to convert_command
#                           when script_path's hash has changed, so the script
#                           reprocesses sessions it would otherwise skip.

projects:
  - lab: kemere
    # TODO: fill in with the real dandiset ids once assigned on emberarchive.
    incoming_dandiset_id: "000477"
    standardized_dandiset_id: "000477"
    session_glob: "sourcedata/raw/*-Session*"
    script_path: "labs/kemere/code/convert_raw_to_bids.py"
    dandi_instance: emberarchive
    overwrite_flag: "--overwrite"
    convert_command:
      - python3
      - "{repo_root}/labs/kemere/code/convert_raw_to_bids.py"
      - "--raw-dir"
      - "{incoming_dir}/sourcedata/raw"
      - "--bids-dir"
      - "{standardized_dir}/sourcedata/rawbids"
      - "--species"
      - "Ovis aries"
