# Environment for dispatch.py itself (repo-level cron infra, not a lab).
# Not pinned/containerized: dispatch runs directly on the self-hosted runner,
# which is also expected to already have the `dandi` CLI installed and
# configured (dispatch shells out to it; see ../README.md).
#
# dispatch.py/registry.py/state.py are standard-library only at run time
# (the registry is plain JSON) -- dependencies is only the test extra below.
# The package carries no importable modules (dispatch.py/registry.py/
# state.py live one directory up, in dispatch/, and are run as scripts --
# Python puts a script's own directory on sys.path, so `import registry`/
# `import state` from dispatch.py works without installation), so the
# wheel build below ships no files (bypass-selection); installing this
# only realises the dependency sets.

[project]
name = "data-ingest-dispatch"
version = "0.1.0"
description = "Cron dispatch for the ember-incoming -> ember-standardized ingest pipeline."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=7",
  "jsonschema>=4",  # validates projects.json/sessions.json against dispatch/schemas/*.json in tests
]

[tool.hatch.build.targets.wheel]
bypass-selection = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
