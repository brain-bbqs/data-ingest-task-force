name: Python dev environment tests

# Installs each suite's loose environment with pip directly on the runner and
# runs the tests there. This exercises the uncontainerized developer setup
# only. The PR gate is container_images.yml, which runs these same suites
# inside a fresh build of each image before it can publish.

permissions:
  contents: read

on:
  workflow_dispatch:
  # Callable so the scheduled run (daily_tests.yml) exercises exactly this
  # suite rather than a drifting copy of it.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install test environment
        run: pip install "./labs/kemere/envs[test]"

      - name: Run the integration test
        run: python -m pytest labs/kemere/tests/ -q

  InmanIntegration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install test environment
        run: pip install "./labs/inman/envs[test]"

      - name: Run the integration test
        run: python -m pytest labs/inman/tests/ -q

  ShepherdSmoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install test environment
        run: pip install "./labs/shepherd/envs[test]"

      - name: Run the smoke test
        run: python -m pytest labs/shepherd/tests/ -q

  SuthanaInLabIntegration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install test environment
        run: pip install "./labs/suthana/in-lab/envs[test]"

      - name: Run the integration test
        run: python -m pytest labs/suthana/in-lab/tests/ -q

  Dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test environment
        run: pip install "./dispatch/envs[test]"

      - name: Run dispatch's unit tests
        run: python -m pytest dispatch/tests -q
