ci:
  autoupdate_schedule: quarterly

default_install_hook_types:
  - pre-commit

default_language_version:
  python: python3.13

# The committed test fixtures (raw inputs and expected BIDS outputs) must stay
# byte-for-byte identical to what the conversion pipeline produces.
#
# shepherd_to_nwb.py, config.yaml, and README.md under labs/shepherd/code/ are
# a verbatim port of the original conversion work, kept unformatted and
# unlinted as original provenance. batch_convert.py alongside them is new
# code and gets the normal treatment. Drop the shepherd exclusions in the
# follow-up that takes ownership of the ported files (see
# labs/shepherd/README.md).
exclude: ^labs/(kemere/tests/(example_raw|expected_output)|inman/tests/example_raw|suthana/in-lab/tests/example_raw)/|^labs/shepherd/code/(shepherd_to_nwb\.py|config\.yaml|README\.md)$

repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace

-   repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
    -   id: black

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.20
  hooks:
  - id: ruff
    args: [ --fix ]

- repo: https://github.com/codespell-project/codespell
  rev: v2.4.2
  hooks:
  - id: codespell
    additional_dependencies:
    - tomli
