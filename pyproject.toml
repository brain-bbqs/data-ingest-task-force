# Repository tooling configuration, shared across the per-lab codebases nested
# under labs/ (e.g. labs/kemere/). Each lab's runtime environment is declared
# separately under its own envs/pyproject.toml (see e.g. labs/kemere/containers/).

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120
exclude = [
  "*/__init__.py",
  "labs/kemere/tests/example_raw",
  "labs/kemere/tests/expected_output",
  "labs/inman/tests/example_raw",
  # Verbatim port of the original Shepherd conversion work, kept unformatted
  # and unlinted as original provenance (see labs/shepherd/README.md).
  # batch_convert.py alongside it is new code and is linted normally.
  "labs/shepherd/code/shepherd_to_nwb.py",
  # Verbatim port of the original Sanes viewer example, kept unformatted and
  # unlinted as original provenance (see labs/sanes/README.md). The converter
  # and batch driver alongside it are new code and are linted normally.
  "labs/sanes/code/pynaViz_ex.py",
  # Verbatim ports of the lab-supplied v2 Sanes scripts that supersede the v1
  # notebook, kept unformatted and unlinted as original provenance (see
  # labs/sanes/README.md). _sanes_to_nwb.py and batch_convert.py alongside them
  # are new code and are linted normally.
  "labs/sanes/code/sanes_multisubject_to_nwb.py",
  "labs/sanes/code/sanes_individual_subject_to_nwb.py",
  "labs/sanes/code/concat_sanes_data.py",
]

[tool.ruff.lint]
select = ["F", "E", "I"]
fixable = ["ALL"]

[tool.ruff.lint.isort]
relative-imports-order = "closest-to-furthest"

[tool.pytest.ini_options]
markers = [
  "ai_generated: test authored (fully or mostly) by an AI coding agent, see AGENTS.md",
]
