# If there are any questions about the meaning of certain metadata fields:
# The NWB GUIDE (https://nwb-guide.readthedocs.io/en/stable/) provides extensive documentation on metadata reqs

# Provisional values below (marked PROVISIONAL) keep the conversion runnable
# end-to-end on sample uploads. Replace them with the real lab metadata.
# Each one cites its question in ../OPEN_QUESTIONS.md (Q<N>).
# The intake sources are the BRAIN-BBQS questionnaire and the lab's
# Ferret_Hyperscanning_MetaData.xlsx (see ../prompts/initial.md).

session:
  description_template: >-
    Ferret hyperscanning, subject {subject} (headstage HS{headstage}) with partner
    {partner} (HS{partner_headstage}): naturalistic behavior of the dyad in an
    open-field box with a toy. {channel_map} channel map.
  notes_template: "Pair {pair}. Session log usable data: {usable_data}. Session log notes: {notes}."
  timezone: America/New_York   # PROVISIONAL (Q9). US Eastern fits both the PI's institution and the questionnaire contact; confirm with the lab
  lab: Zhang Lab
  institution: Michigan State University   # PROVISIONAL (Q9). The questionnaire contact is at UNC School of Medicine; confirm where the data were collected
  experimenter: []   # PROVISIONAL (Q9). List in "Last, First M." style
  experiment_description: >-
    Simultaneous wireless electrophysiology recordings of ferret dyads during
    naturalistic behavior in an open field box with a toy included.
    Electrophysiology is recorded from two cortical regions, the premotor cortex
    and the posterior parietal cortex. Behavior is recorded from five camera angles.
  keywords:
    - hyperscanning
    - ferret
    - social behavior
    - premotor cortex
    - posterior parietal cortex
    - wireless electrophysiology
  related_publications: []   # DOI links, none yet

subjects:
  defaults:
    species: http://purl.obolibrary.org/obo/NCBITaxon_9669  # Mustela putorius furo (domestic ferret)
    sex: U        # PROVISIONAL (Q9) ("unknown"). Required by DANDI, should be one of "M", "F", "O", "U"
    age: P1Y      # PROVISIONAL (Q9). Required by DANDI, should be an ISO 8601 duration, or use date_of_birth instead
  "0235":
    description: "Ferret 0235, identified by a shaved lower back"
  "0236":
    description: "Ferret 0236, no shave"
  "0237":
    description: "Ferret 0237, identified by a shaved upper back"

devices:
  headstage:
    name_template: "Sprite32HS{headstage}"
    description: "SpikeGadgets Sprite32 wireless datalogger headstage, recorded through the Trodes acquisition software"
    manufacturer: SpikeGadgets
  camera:
    name_template: "BlackflyS_cam{camera}"
    description: "Teledyne FLIR Blackfly S USB3 camera, hardware-triggered together with the other four cameras"
    manufacturer: Teledyne FLIR

ecephys:
  # Each animal's merged .rec is expected to hold only its own 32 channels. If a
  # merged file holds more, the split is PROVISIONAL (Q8). It assumes the
  # headstages sit in basename order, 32 hardware channels each (0-31, then 32-63).
  channels_per_headstage: 32
  electrical_series_description: "Raw wideband extracellular recording from one animal's 32-channel headstage at 20 kHz"
  regions:
    PMC:
      location: premotor cortex
      description: "Premotor cortex channels of this animal's headstage"
    PPC:
      location: posterior parietal cortex
      description: "Posterior parietal cortex channels of this animal's headstage"
  # Which region each headstage channel belongs to, keyed by channel parity
  # within the headstage (channel index 0-31). The belly-up map applies to
  # sessions whose session-log row has belly_up = 1.
  channel_maps:
    belly_down:
      odd: PMC
      even: PPC
    belly_up:
      odd: PPC
      even: PMC
  # Channels 30 and 31 are the reference electrodes of their region, sitting
  # 0.5 mm above the other electrodes.
  reference_channels: [30, 31]
  reference_note: "Reference electrode, 0.5 mm above the other electrodes of its region"

video:
  # Frame rate and frame count are read from each file's header by NeuroConv's ExternalVideoInterface.
  starting_time: 0.0   # PROVISIONAL (Q5, Q7). Frame-pulse synchronization is a follow-up; until then every video starts at the recording start
  cameras: [14, 46, 58, 67, 68]

session_log:
  # Export of the lab's session-log sheet, relative to this file (parsing rules: Q12). Times are
  # 24-hour local wall clock; rows whose sheet cell had no AM/PM were read as
  # afternoon when the hour was below 8.
  path: session_log.csv

corrections:
  # Recordings whose uploaded names contradict their own files, keyed by the recording name as
  # uploaded (https://github.com/brain-bbqs/data-ingest-task-force/issues/62). Each was checked
  # against the merged files' headers, which carry the recording's start time and the serial of
  # the headstage that recorded them (03103 00106 is HS3, 00105 HS4, 00127 HS5, 00130 HS6).
  # "name" replaces the name the animals, headstages and session are read from. "merged" gives an
  # animal's merged file, relative to the recording directory and keyed by <animal>HS<headstage>.
  # It is used only while that file exists, so a rename on the lab's side takes over.
  0235HS3_0237HS4_20260325_124806:
    merged:
      0235HS3: 0235HS3/0235HS3_0237HS4_20260325_124806_0236HS3_merged.rec
    reason: >-
      The merged file in 0235HS3/ is named for 0236. It carries HS3's serial, and 0236 was not
      recorded that day.
  0235HS6_0237HS6_20260425_132118:
    name: 0235HS5_0237HS6_20260425_132118
    reason: >-
      The recording name puts both animals on HS6. The 0235HS5/ folder, both merged file names and
      0235's serial say 0235 wore HS5.
  0236HS5_0237HS6_20260408_155939:
    merged:
      0237HS6: 0237HS8/0236HS5_0237HS6_20260408_155939_0237HS6_merged.rec
    reason: >-
      0237's merged file sits in a folder named 0237HS8. Its own name and its serial say HS6.
  02355HS6_0236HS5_20260408_134217:
    name: 0235HS6_0236HS5_20260408_134217
    reason: >-
      The recording name has an extra 5 in 0235. The pair folder, the 0235HS6/ folder and its merged
      file name say 0235, and its serial matches HS6.
  0236HS3_0237HS4_Session1_20260308_130347:
    merged:
      0236HS3: 0236HS3/0236HS3_0237HS4_Session1_20260308_130347_HS30236_merged.rec
      0237HS4: 0237HS4/0236HS3_0237HS4_Session1_20260308_130347_merged.rec
    reason: >-
      The merged files are named HS30236 and with no headstage at all. Each sits in its animal's
      folder and carries that headstage's serial.
