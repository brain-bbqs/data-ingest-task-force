# If there are any questions about the meaning of certain metadata fields:
# The NWB GUIDE (https://nwb-guide.readthedocs.io/en/stable/) provides extensive documentation on metadata reqs

# Provisional values below (marked PROVISIONAL) keep the conversion runnable
# end-to-end on sample uploads. Replace them with the real lab metadata.

session:
  id: ''
  description: 'Navigation walk session (PROVISIONAL description, replace with real metadata)'
  start_time: '2024-01-0100:00:00Z'      # PROVISIONAL. In this format: %Y-%m-%d%H:%M:%S%z, ex 2025-10-2113:45:00Z
  lab: ''
  experimenter: ''    # list in Last, First M. style
  institution: 'University of Utah'   # PROVISIONAL, confirm with the lab
  keywords: ''        # key words to describe the experiment, ie olfaction or pose estimation
  notes: ''
  pharmacology:
  protocol:
  related_publications: '' # should be DOI links
  data_collection: ''
  surgery: ''
  virus: ''
  stimulus_notes: ''

subject:
  id: ''
  description: 'Human participant in the ambulatory navigation task (PROVISIONAL description)'
  species: 'Homo sapiens'
  genotype: ''
  strain: ''
  sex: 'U'             # PROVISIONAL ("unknown"). Required by DANDI, should be one of "M", "F", "O", "U"
  age: 'P30Y'          # PROVISIONAL. Required by DANDI, should be ISO 8601 duration - for example, P5W3D
  weight: ''           # In grams
  date_of_birth: ''    # can be used instead of age - should be an ISO 8601 timestamp

timeseries:
  ambient_light:
    description: 'Ambient light values recorded over time'
    unit: 'lumens'
  kde:
    description: 'KDE from 20 annotators'
    unit: 'NA'
  movement_velocity:
    description: 'Walking pace / velocity'
    unit: 'cm/s'
  gaze_position:
    description: 'Gaze (x,y) over time'
    reference_frame: 'Ambulatory – no fixed screen'
    unit: 'pixels'
  gaze_fixation:
    description: 'Fixation indicator (1/0)'
    unit: 'NA'
  imu_gyro:
    description: 'Gyroscope (x,y,z)'
    reference_frame: 'IMU (Inertial measurement unit) sensor frame'
    unit: 'deg/s'
  imu_accel:
    description: 'Acceleration (x,y,z)'
    reference_frame: 'IMU (Inertial measurement unit) sensor frame'
    unit: 'm/s²'
  imu_orientation:
    description: 'Orientation (roll,pitch)'
    reference_frame: 'IMU (Inertial measurement unit) sensor frame'
    unit: 'degrees'


device_eyetracker:
  name: "RNS Neurostimulator v2"
  description: "Implanted stim-record device"

device_imu:
  name: "name of IMU (Inertial measurement unit) device"
  description: "Inertial Measurement Unit, version X"

device_ieeg:
  name: "name of ieeg device"
  description: "version X, software Y used, etc"

electrode_group1:
  name: "electrodes group 1"
  description: "Shank 1 of a multi shank probe"
  location: "human medial temporal lobe"

lfp:
  description: "LFP data"
  filtering: "RNS 4–90 Hz 1st-order Butterworth"
  unit: "V"

# Four entries to match the four iEEG channels in d_np (PROVISIONAL
# names/coordinates, replace with the real electrode map).
channelmap:
  F1: {label: "F1",
       x: 1.0, y: 1.0, z: 1.0,
       filtering: "band-pass filtered 300-6000 Hz"
      }
  F2: {label: "F2",
       x: 2.0, y: 2.0, z: 2.0,
       filtering: "band-pass filtered 300-6000 Hz"
      }
  F3: {label: "F3",
       x: 3.0, y: 3.0, z: 3.0,
       filtering: "band-pass filtered 300-6000 Hz"
      }
  F4: {label: "F4",
       x: 4.0, y: 4.0, z: 4.0,
       filtering: "band-pass filtered 300-6000 Hz"
      }
