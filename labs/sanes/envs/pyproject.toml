# Loose, declarative environment for the Sanes conversion pipeline, shared by every Sanes dataset.
#
# This file is the single source of truth for the Python environment. It is intentionally NOT pinned:
# containers/sanes.Dockerfile resolves it fresh at build time and the resulting image (by digest) is the
# reproducibility lock, so there is no lockfile in the repository to keep in sync. Only bounds that a
# release demonstrably needs are set, each with its reason.
#
# The conda environments the original v1 notebook ran in are kept verbatim under envs/original/ as
# provenance. They are a record, not an input to any build.
#
# The converter also shells out to FFmpeg (ffprobe and ffmpeg), a system package installed in
# containers/sanes.Dockerfile rather than a Python one.

[project]
name = "sanes-r34da059513-ingest"
version = "0.1.0"
description = "Convert Sanes-lab multi-animal gerbil recordings into NWB files."
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "natsort",
  "PyYAML",
  "tqdm",
  "h5py",
  # pynwb.event.EventsTable, which stores the vocalization events, first shipped in pynwb 4.0.
  "pynwb>=4",
  "ndx-multisubjects",
  # ndx-sound 0.2.2 failed to load its namespace under current HDMF ("Cannot extend float64 to float").
  "ndx-sound>=0.2.3",
  "ndx-pose",
  # Only reads .slp files. Pose is written with ndx-pose directly.
  "sleap-io",
  "neuroconv",
  # neuroconv 0.10.2 still imports zarr's 2.x codec registry, while hdmf-zarr 0.14.0 moved to zarr>=3.4,
  # so an unbounded resolve installs zarr 3 and `import neuroconv` fails. Drop this bound once a
  # neuroconv release imports under zarr 3.
  "zarr<3",
]

[project.optional-dependencies]
# The converter's own dependencies double as the test runtime. The test extra only adds the runner.
test = [
  "pytest>=7",
]

# Installing this only realizes the dependency set. The converter is run as a script, not imported.
[tool.setuptools]
py-modules = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
