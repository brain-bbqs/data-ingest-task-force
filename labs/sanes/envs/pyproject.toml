# Loose, declarative environment for the Sanes gerbil vocal-interaction to NWB
# conversion pipeline.
#
# This file is the single source of truth for the Python environment. It is
# intentionally NOT pinned: containers/sanes.Dockerfile resolves it fresh at
# build time and the resulting image (by digest) is the reproducibility lock,
# so there is no lockfile in the repository to keep in sync.
#
# The original conda environments the conversion was written in are kept
# verbatim under envs/original/ as provenance. They are a record, not an input
# to any build.
#
# The converter also shells out to `ffprobe` to read video duration and frame
# count. That is an external FFmpeg dependency, a *system* package installed in
# containers/sanes.Dockerfile rather than a Python one.

[project]
name = "sanes-r34da059513-ingest"
version = "0.1.0"
description = "Convert Sanes-lab multi-animal gerbil vocal-interaction recordings into NWB files."
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "natsort",
  "python-dateutil",
  "PyYAML",
  "tqdm",
  "hdmf",
  # These three carry upper bounds, unlike the sibling labs' declarations. The
  # ported code is written against the NWB stack in envs/original/, and both
  # newer lines break it: pynwb 3.2 requires num_samples on an external-file
  # ImageSeries that uses rate, and sleap-io 0.5 moved SLEAP pose data out of
  # the "behavior" processing module the port reads back. Lifting these bounds
  # is part of the follow-up that takes ownership of the port, not something
  # to do while the code stays as-is.
  "pynwb>=3.1,<3.2",
  "sleap-io>=0.4,<0.5",
  # SLEAPInterface lives behind neuroconv's sleap extra.
  "neuroconv[sleap]>=0.8,<0.9",
  # Only the notebook's one-off "combine every chunk video into one mp4" cell
  # uses this. It is kept so that cell still runs inside this environment.
  "ffmpeg-python",
]

[project.optional-dependencies]
# The converter's own dependencies double as the test runtime. The test extra
# only adds the runner itself.
test = [
  "pytest>=7",
]

# The package carries no importable modules; installing it only realises the
# dependency sets above (the converter is run as a script, not imported).
[tool.setuptools]
py-modules = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
