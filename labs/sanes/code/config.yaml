# Sanes R34 dataset (incoming 000522, standardized 000523).
# Provisional metadata. Replace every PROVISIONAL value before final upload.
# See https://nwb-guide.readthedocs.io/en/stable/ for NWB metadata guidance.
# The values come from the lab's config_multisubject.yaml, which says it holds placeholder metadata.
# 000523 already holds earlier, hand-made work at its root, so this dataset's output nests under one folder.
output_subdirectory: autogenerated
session:
  dataset: r34  # Prefixes NWB identifiers so session names stay unique across datasets
  lab: Sanes
  institution: New York University  # PROVISIONAL
  experimenter: Muttath Joseph, Niegil Francis  # PROVISIONAL. List in Last, First M. style
  description: Video and audio data from interacting gerbils  # PROVISIONAL
  start_time: "2025-10-13T10:35:00+00:00"  # PROVISIONAL. Used only for a session without an experiment log
subject:
  species: Meriones unguiculatus
  sex: U  # PROVISIONAL
  age: PROVISIONAL
# Optional per-track overrides of `subject`, by sorted track order. `id` names the sub-<id> folder.
subjects:
  - {id: S0, sex: M, age: P33D, description: Placeholder metadata in a multi-subject interaction experiment}  # PROVISIONAL
  - {id: S1, sex: F, age: P30D, description: Placeholder metadata in a multi-subject interaction experiment}  # PROVISIONAL
  - {id: S2, sex: F, age: P23D, description: Placeholder metadata in a multi-subject interaction experiment}  # PROVISIONAL
audio:
  description: Synchronized microphone recordings
video:
  description: Behavioral video concatenated from the session's chunk videos
