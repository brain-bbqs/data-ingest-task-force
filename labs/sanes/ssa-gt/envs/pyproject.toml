# Unpinned environment declaration. The container image is the reproducibility lock.
[project]
name = "sanes-ssa-gt-u01da063581-ingest"
version = "0.1.0"
description = "Convert Sanes SSA GT recordings to multi-animal NWB."
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "PyYAML",
  "hdmf==4.0.0",
  "pynwb==3.0.0",
  "ndx-multisubjects",
  "ndx-sound==0.2.2",
  "neuroconv",
  "zarr<3",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
py-modules = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
