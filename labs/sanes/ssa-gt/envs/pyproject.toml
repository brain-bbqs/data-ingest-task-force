# Unpinned environment declaration. The container image is the reproducibility lock.
# The converter also shells out to FFmpeg (ffprobe and ffmpeg), a system package
# installed by containers/sanes-ssa-gt.Dockerfile rather than a Python one.
[project]
name = "sanes-ssa-gt-u01da063581-ingest"
version = "0.1.0"
description = "Convert Sanes SSA GT recordings to multi-animal NWB."
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "PyYAML",
  "h5py",
  # pynwb.event.EventsTable, which stores the vocalization events, first shipped in pynwb 4.0.
  "pynwb>=4",
  "ndx-multisubjects",
  # ndx-sound 0.2.2 failed to load its namespace under current HDMF ("Cannot extend float64 to float").
  "ndx-sound>=0.2.3",
  "neuroconv",
  # neuroconv 0.10.2 still imports zarr's 2.x codec registry. Drop this bound once a neuroconv
  # release imports under zarr 3.
  "zarr<3",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
py-modules = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
